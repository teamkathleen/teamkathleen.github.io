name: Sync GivenGain total and donors

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 6 a.m. Eastern (7 a.m. during daylight time)
  workflow_dispatch:         # "Run workflow" button for an update on demand

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_givengain.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/campaign.json; then
            echo "Nothing new."
          else
            git config user.name "TeamKathleen sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/campaign.json
            git commit -m "Daily GivenGain sync"
            git push
          fi
