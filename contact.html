<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Team Kathleen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Figtree:wght@400;600;800&display=swap">
<style>
:root { --navy:#1F2A4D; --teal:#3E9C96; --coral:#EE6F5B; --gold:#F2B544; --sky:#DCEFF0; --paper:#F7FBFB; --muted:#5B6680;
  --varsity:"Varsity","Graduate","Rockwell",Georgia,serif; --body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--navy); font: 17px/1.6 var(--body); }
.wrap { max-width: 620px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-left, 0px)) 64px; }
.back { font-weight: 800; color: var(--teal); text-decoration: none; }
h1 { font-family: var(--varsity); font-weight: 400; text-transform: uppercase; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 24px 0 12px; }
.lede { margin: 0 0 20px; }
.nudge { background: #fff; border: 2px solid var(--navy); border-radius: 14px; padding: 14px 16px; box-shadow: 4px 4px 0 var(--navy); margin-bottom: 28px; }
.nudge a { color: var(--coral); font-weight: 800; }
form { display: grid; gap: 16px; }
label { font-weight: 800; display: grid; gap: 6px; }
input, select, textarea { font: inherit; padding: 12px 14px; border: 2px solid var(--navy); border-radius: 10px; background: #fff; color: var(--navy); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
textarea { min-height: 140px; resize: vertical; }
button { font: inherit; font-weight: 800; cursor: pointer; justify-self: start; border-radius: 999px; padding: 13px 28px;
  background: var(--coral); color: #fff; border: 2px solid var(--coral); box-shadow: 3px 3px 0 var(--navy); }
.hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Back to Team Kathleen</a>
  <h1>Get in touch</h1>
  <p class="lede">For company gifts, matching challenges, sponsoring a mile, or media.</p>
  <p class="nudge">Just want to give? The fastest way is <a href="https://www.givengain.com/project/kathleen-raising-funds-for-girls-on-the-run-greater-boston-129854?utm_source=teamkathleen&utm_medium=web&utm_content=contact">my GivenGain page</a>.</p>

  <!-- FORM_ENDPOINT: replace with the form service's URL (for example a Formspree form) before launch. -->
  <form action="FORM_ENDPOINT" method="POST">
    <label>Your name <input id="name" name="name" autocomplete="name" required></label>
    <label>Email <input id="email" name="email" type="email" autocomplete="email" required></label>
    <label>What's this about?
      <select id="topic" name="topic">
        <option>Sponsoring a mile</option>
        <option>A company gift or match</option>
        <option>Media or interview</option>
        <option>Something else</option>
      </select>
    </label>
    <label>Message <textarea id="message" name="message" required></textarea></label>
    <input class="hp" id="website" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">Send</button>
  </form>
</div>
</body>
</html>
